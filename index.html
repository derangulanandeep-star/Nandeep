<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NANDEEP — AI &amp; Full-Stack Developer</title>
    <meta
      name="description"
      content="Personal portfolio of Nandeep, an AI & Full-Stack Developer and Computer Science student at NIAT turning ideas into intelligent digital experiences."
    />
    <meta property="og:title" content="NANDEEP — AI & Full-Stack Developer" />
    <meta
      property="og:description"
      content="Turning Ideas Into Intelligent Digital Experiences. Explore Nandeep's engineering craft, automation systems, and full-stack projects."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nandeep-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-zinc-300 selection:text-zinc-950 dark:selection:bg-zinc-200 dark:selection:text-zinc-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
